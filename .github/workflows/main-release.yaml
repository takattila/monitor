# Create new release by pushing git tag:
# - git tag -a v1.0.0 -m "First release"
# - git push --tags

name: main release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  test:
    uses: ./.github/workflows/reusable-test.yaml

  release:
    needs:
      - test
    permissions:
      contents: write
    strategy:
      matrix:
        goos: 
          - linux
        goarch: 
          - 386
          - amd64
          - arm
          - arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      
      - name: Env
        id: vars
        run: |
          echo "tag=${GITHUB_REF#refs/*/}" >> "$GITHUB_OUTPUT"
          echo "tag_msg<<_PR_MSG_" >> "$GITHUB_OUTPUT"
          git cat-file -p "$(git describe --tags --abbrev=0)" | tail -n +6 >> "$GITHUB_OUTPUT"
          echo "_PR_MSG_" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          env CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o cmd internal/api/app/api.go
          env CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o cmd internal/web/app/web.go
          env CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o cmd internal/credentials/app/credentials.go

          echo "# Version: ${{ steps.vars.outputs.tag }}"                                                   > VERSION.md
          echo ""                                                                                          >> VERSION.md
          echo "${{ steps.vars.outputs.tag_msg }}"                                                         >> VERSION.md

          echo "# Info"                                                                                     > INFO.md
          echo ""                                                                                          >> INFO.md
          echo "For more information, please visit: https://github.com/takattila/monitor#monitor-services" >> INFO.md

      - name: ZIP
        run: zip -qq -r monitor-${{ steps.vars.outputs.tag }}-${{ matrix.goos }}-${{ matrix.goarch }}.zip . -x *.git* -x *internal* -x *pkg* -x *scripts* -x *assets* -x *README.md* -x *go.mod* -x *go.sum*


      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: ./**/*.zip
          name: ${{ env.RELEASE_VERSION }}